# Emscripten WebAssembly (Wasm) cross-compilation toolchain for enki
# Target: wasm32 / WebGL 2.0 (HTML5 Canvas)
#
# Usage (from the enki root directory):
#   meson setup build-wasm --cross-file cross/wasm.ini
#   ninja -C build-wasm

[binaries]
c       = 'emcc'
cpp     = 'em++'
ar      = 'emar'
ranlib  = 'emranlib'
strip   = 'emstrip'

[built_in_options]
c_std       = 'c11'
cpp_std     = 'c++20'
default_library = 'static'

[properties]
needs_exe_wrapper = true

[host_machine]
system     = 'emscripten'
cpu_family = 'wasm32'
cpu        = 'wasm32'
endian     = 'little'
