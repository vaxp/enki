# Android NDK cross-compilation toolchain for enki — Windows host
# NDK Version: r30.0.16248370
# Target: Android arm64-v8a, API 26 (Android 8.0)
#
# Usage (from the enki root directory):
#   meson setup build-android --cross-file cross/android-arm64.ini
#   ninja -C build-android

[constants]
ndk_root  = 'C:\\Users\\x\\AppData\\Local\\Android\\Sdk\\ndk\\30.0.16248370'
api_level = '26'
toolchain = ndk_root + '\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin'
triple    = 'aarch64-linux-android'

[binaries]
c       = toolchain + '\\' + triple + api_level + '-clang.cmd'
cpp     = toolchain + '\\' + triple + api_level + '-clang++.cmd'
ar      = toolchain + '\\llvm-ar.exe'
strip   = toolchain + '\\llvm-strip.exe'
ranlib  = toolchain + '\\llvm-ranlib.exe'

[built_in_options]
c_std   = 'c11'
cpp_std = 'c++20'

[host_machine]
system     = 'android'
cpu_family = 'aarch64'
cpu        = 'armv8'
endian     = 'little'
